<div class="col-md-6">
    <article class="card room-card mb-3">
        <div class="card-body">
            <h5 class="card-title">{{ room.name|default:"Без названия" }}</h5>
            <p class="card-text">
                Студия: {{ room.studio }}<br>
                Вместимость: {{ room.capacity }} мест<br>
                Цена: {{ room.price_per_hour }} руб/час
            </p>
            <a href="{% url 'rooms:detail' room.id %}" class="btn btn-primary">
                Подробнее
            </a>
        </div>
    </article>
</div>
